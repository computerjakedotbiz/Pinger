<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pinger" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>Pinger</title>
<style>
  :root{
    --bg:#0b0b0f; --card:#15151c; --card2:#1c1c26;
    --text:#f4f4f6; --muted:#8b8b97; --line:#26262f;
    --accent:#6d78ff; --accent2:#3a3f66; --danger:#ff5a6a;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:max(20px,env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px 4px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0}
  .sub{color:var(--muted);font-size:14px;margin:2px 2px 22px}
  #status{font-size:13px;color:var(--muted)}
  #status.on{color:#4ade80}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px;margin-bottom:12px;display:flex;gap:14px;align-items:center;
    transition:transform .12s ease}
  .card:active{transform:scale(.985)}
  .emoji{font-size:26px;line-height:1;width:34px;text-align:center;flex:none}
  .body{flex:1;min-width:0}
  .title{font-size:17px;font-weight:600}
  .title.off{color:var(--muted);text-decoration:line-through}
  .meta{color:var(--muted);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toggle{width:50px;height:30px;border-radius:16px;background:var(--accent2);position:relative;flex:none;transition:background .18s}
  .toggle.on{background:var(--accent)}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;transition:left .18s}
  .toggle.on::after{left:23px}
  .empty{color:var(--muted);text-align:center;padding:48px 10px;font-size:15px}
  .fab-bar{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 60%,transparent);display:flex;gap:10px}
  button{font:inherit;border:none;border-radius:14px;padding:14px;font-weight:600;color:var(--text);cursor:pointer}
  .btn-primary{flex:1;background:var(--accent)}
  .btn-ghost{background:var(--card2);border:1px solid var(--line)}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
  .sheet-bg.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;
    border-top:1px solid var(--line);padding:22px 18px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .24s cubic-bezier(.3,.8,.3,1);z-index:11;max-height:92vh;overflow:auto}
  .sheet.show{transform:translateY(0)}
  .sheet h2{margin:0 0 16px;font-size:20px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 2px 6px}
  input,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
    color:var(--text);padding:12px;font:inherit}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .days{display:flex;gap:6px;margin-top:6px}
  .day{flex:1;text-align:center;padding:10px 0;border-radius:10px;background:var(--card2);
    border:1px solid var(--line);font-size:13px;color:var(--muted);user-select:none}
  .day.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .sheet-actions{display:flex;gap:10px;margin-top:22px}
  .del{background:transparent;color:var(--danger);border:1px solid var(--line)}
</style>
</head>
<body>
  <header>
    <h1>Pinger</h1>
    <span id="status">notifications off</span>
  </header>
  <div class="sub">Reminders that ping you on your own cadence 🔔</div>

  <div id="list"></div>

  <div class="fab-bar">
    <button class="btn-ghost" id="enableBtn">Enable notifications</button>
    <button class="btn-primary" id="addBtn">+ New reminder</button>
  </div>

  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet">
    <h2 id="sheetTitle">New reminder</h2>
    <label>Emoji &amp; label</label>
    <div class="row">
      <input id="fEmoji" style="flex:0 0 64px;text-align:center" maxlength="2" value="🔔" />
      <input id="fLabel" style="flex:1" placeholder="Drink water" />
    </div>
    <div class="row">
      <div>
        <label>Every</label>
        <input id="fEvery" type="number" min="1" value="60" inputmode="numeric" />
      </div>
      <div>
        <label>Unit</label>
        <select id="fUnit"><option value="min">minutes</option><option value="hour">hours</option></select>
      </div>
    </div>
    <div class="row">
      <div><label>From</label><input id="fStart" type="time" value="09:00" /></div>
      <div><label>Until</label><input id="fEnd" type="time" value="18:00" /></div>
    </div>
    <label>On these days</label>
    <div class="days" id="fDays"></div>
    <div class="sheet-actions">
      <button class="del" id="delBtn" style="display:none">Delete</button>
      <button class="btn-ghost" id="cancelBtn" style="flex:1">Cancel</button>
      <button class="btn-primary" id="saveBtn" style="flex:1">Save</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
